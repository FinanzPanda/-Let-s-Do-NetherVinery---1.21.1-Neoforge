plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'

    id 'net.neoforged.moddev' version '2.0.148'

    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.darkhax.curseforgegradle' version '1.1.25'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'letsdo-nether-vinery-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        url = 'https://maven.blamejared.com/'
    }

    maven {
        url = 'https://jitpack.io'
    }

    maven {
        url = 'https://api.modrinth.com/maven'
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    implementation(
            "net.satisfy.foundation:foundation-neoforge:${foundation_version}"
    ) {
        transitive = false
    }

    // Optional integrations: only enable if these versions
    // exist for Minecraft 1.21.1 and NeoForge.
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    localRuntime "dev.emi:emi-neoforge:${emi_version}"
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: project.version,
                minecraft_version: minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version: neo_version,
                loader_version_range: loader_version_range,
                mod_id: mod_id,
                mod_name: mod_name
        )
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'dev'
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = 'lets-do-vinery'
    versionNumber = mod_version
    versionName = "${archivesBaseName}-${mod_version} [${minecraft_version}-neoforge]"
    versionType = 'release'
    changelog = rootProject.file('CHANGELOG.md').exists()
            ? rootProject.file('CHANGELOG.md').text
            : ' '
    gameVersions = [minecraft_version]
    loaders = ['neoforge']
    uploadFile = tasks.named('jar')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'lets-do-nether-vinery-neoforge'
            from components.java
        }
    }

    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}